[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["wandl <hiwepy@gmail.com>"]
repository = "https://github.com/easy-4-rust/WxRust"
homepage = "https://github.com/easy-4-rust/WxRust"
readme = "README.md"
keywords = ["wechat", "weixin", "wx", "sdk", "mp", "miniapp", "pay"]
categories = ["api-bindings", "web-programming"]

[workspace.dependencies]
async-trait = "0.1.89"
tokio = { version = "1.52.4", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
quick-xml = "0.41.0"
thiserror = "2.0.18"
tracing = "0.1.44"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
url = "2.5.8"
base64 = "0.23.0"
hex = "0.4.3"
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
aes = "0.9.2"
cbc = "0.2.1"
rsa = { version = "=0.9.10", features = ["pem", "sha2", "std"] }
percent-encoding = "2.3.2"
rand = "0.10.2"
dashmap = "6.1.0"
once_cell = "1.21.0"
redis = "0.29.0"
tempfile = "3.27.0"
mime = "0.3.17"
bytes = "1.10.0"
futures-util = "0.3.32"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
