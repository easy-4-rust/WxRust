[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["wandl <hiwepy@gmail.com>"]
repository = "https://github.com/easy-4-rust/WxRust"
homepage = "https://github.com/easy-4-rust/WxRust"
readme = "README.md"
keywords = ["wechat", "weixin", "wx", "sdk", "miniapp"]
categories = ["api-bindings", "web-programming"]

[workspace.dependencies]
# 内部 crate 统一声明（version + path）：本地构建走 path，publish 时携带 crates.io 版本号
wx-rust-common = { version = "0.1.4", path = "crates/wx-rust-common" }
wx-rust-mp = { version = "0.1.4", path = "crates/wx-rust-mp" }
wx-rust-miniapp = { version = "0.1.4", path = "crates/wx-rust-miniapp" }
wx-rust-pay = { version = "0.1.4", path = "crates/wx-rust-pay" }
wx-rust-cp = { version = "0.1.4", path = "crates/wx-rust-cp" }
wx-rust-open = { version = "0.1.4", path = "crates/wx-rust-open" }
wx-rust-channel = { version = "0.1.4", path = "crates/wx-rust-channel" }
wx-rust-aispeech = { version = "0.1.4", path = "crates/wx-rust-aispeech" }
wx-rust-qidian = { version = "0.1.4", path = "crates/wx-rust-qidian" }
async-trait = "0.1.89"
tokio = { version = "1.52.4", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
quick-xml = "0.42.0"
thiserror = "2.0.18"
tracing = "0.1.44"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
url = "2.5.8"
base64 = "0.23.0"
hex = "0.4.3"
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
aes = "0.9.2"
cbc = "0.2.1"
rsa = { version = "=0.9.10", features = ["pem", "sha2", "std"] }
percent-encoding = "2.3.2"
rand = "0.10.2"
dashmap = "6.1.0"
once_cell = "1.21.0"
redis = "1.6.0"
tempfile = "3.27.0"
mime = "0.3.17"
bytes = "1.10.0"
futures-util = "0.3.32"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# 组设低优先级，具体 lint（allow）才能覆盖组（warn）
all = { level = "warn", priority = -1 }
# WxJava 方法签名保真迁移：企业微信/支付 API 存在 8~10 参数的原始签名
too_many_arguments = "allow"
# 以下为 Java 1:1 迁移的结构性惯用法，非手写风格问题：
# - bean/card/card.rs 等模块名镜像 Java 包结构（module inception）
module_inception = "allow"
# - 生成代码的请求构造惯用法：let mut req = T::default(); req.field = ...
field_reassign_with_default = "allow"
# - Java 迁移代码保持嵌套 if 的原始结构（Java 无 let-chains；折叠改变可读性）
collapsible_if = "allow"
# - 手写 `% N == 0` 为 Java 迁移惯用法；is_multiple_of 为 1.89 新 lint，非语义改进
manual_is_multiple_of = "allow"
