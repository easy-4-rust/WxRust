name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-features

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      # Gate: block_on 仅允许出现在 sync 门面文件（blocking.rs）内
      - name: block_on gate
        run: scripts/check_block_on.sh

      # Gate: 并发验收（G7）。benches 不在 `cargo test --workspace` 内
      # （harness=false 的 criterion 基准需独立运行），故为独立 step；
      # `--test` 模式 = 每个基准跑一次迭代做正确性断言（断言 panic 即 CI 红）：
      # - common：1000 并发共享未过期 token + 熔断开合（Open 零 transport 调用）
      # - miniapp：1000 并发 token 单飞刷新（断言 token 端点应答数 == 1）
      - name: concurrency bench (wx-rust-common, pipeline + circuit breaker)
        run: cargo bench -p wx-rust-common --bench pipeline_concurrency_bench -- --test
      - name: concurrency bench (wx-rust-miniapp, token single-flight)
        run: cargo bench -p wx-rust-miniapp --bench token_single_flight_bench -- --test

  redis-test:
    name: redis integration tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Redis
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run Redis integration tests
        run: cargo test -p wx-rust-common --features redis --test redis_integration_test
