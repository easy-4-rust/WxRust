name: Sync Feature

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.97.1"

concurrency:
  group: sync-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-feature:
    name: sync feature (blocking facade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run blocking facade tests (feature=sync)
        run: cargo test -p wx-rust-miniapp --features sync --test blocking_facade_test
