[package]
name = "wx-rust-pay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "WxRust 微信支付模块（对应 weixin-java-pay）"

[lints]
workspace = true

[dependencies]
wx-rust-common.workspace = true
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# 流式下载（Task 7 download_bill_stream）：Bytes 分块流 / BoxStream 类型
# （workspace 既有依赖，wx-rust-common 同源，零新增第三方代码）
bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# quick-xml serialize 特性：v2 XML 报文 bean 的 serde 序列化/反序列化
# （`quick_xml::de::from_str` / `quick_xml::se::to_string`，对应 Java XStream）
quick-xml = { workspace = true, features = ["serialize"] }
thiserror = { workspace = true }
percent-encoding = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
# MD5（v2 签名 SignType.MD5，对应 Java commons-codec DigestUtils.md5Hex）
md-5 = "0.10.6"
# AES-256-ECB（v2 退款通知 req_info 解密，对应 Java AES/ECB/PKCS5Padding）
aes = { workspace = true }
# GZIP 对账单解压（对应 Java ZipUtils.unGzip）
flate2 = "1.1.1"
# v3 平台证书验签/敏感信息加密（Wave 1 启用，Java CertificateUtils/Pkcs12 对应能力）
rsa = { workspace = true }
# ---- v3 证书/签名/AES-GCM 基础设施（Wave 1 P3，对应 Java v3/util 包 + PemUtils + WxPayConfig.p12ToPem）----
# AES-256-GCM：通知回调 ciphertext 解密/退款回调加密（Java v3/util/AesUtils：AEAD_AES_256_GCM，apiV3Key）
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
# X.509 证书解析：PemUtils.loadCertificate 的序列号/公钥提取（der 0.7/spki 0.7 体系，与 rsa 0.9.10 同代）
x509-cert = "0.2.5"
# PKCS#12 容器解析：Java KeyStore.getInstance("PKCS12") 的 Rust 等价（纯 Rust；见 WxPayConfig.p12ToPem）
p12 = "0.6.3"
# rsa 0.9 的 RNG（rand_core 0.6 系；workspace 的 rand 0.10 与其不兼容），OsRng 用于 RSA 签名盲化/OAEP 加密
rand_core = { version = "0.6.4", features = ["getrandom"] }
# RSA-OAEP 敏感信息加密使用 SHA-1（Java RsaCryptoUtil：RSA/ECB/OAEPWithSHA-1AndMGF1Padding；rsa 0.9 内部 digest 为 0.10 系，workspace sha1 0.11 不适用）
sha1 = "0.10.6"

[dev-dependencies]
httpmock = "0.8.2"
