[package]
name = "wx-rust-miniapp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "WxRust 小程序模块（对应 weixin-java-miniapp）"
keywords.workspace = true
categories.workspace = true

[features]
# 同步门面（WxMaServiceBlocking）：OnceLock 全局 current_thread runtime
# + block_on 包装（仅 blocking.rs 内使用；tokio rt feature 已由 workspace 提供）
sync = []

[lints]
workspace = true

[dependencies]
wx-rust-common.workspace = true
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
regex = "1.11.1"
thiserror = { workspace = true }
percent-encoding = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

# 并发验收基准（G7）专用 dev 依赖：criterion 与 common 侧同一版本；
# futures-util 供 join_all 驱动并发批次（均为 workspace 既有依赖）
[dev-dependencies]
criterion = "0.5"
futures-util = { workspace = true }

# token 单飞验收基准：--test 模式进 CI（cargo bench -- --test），
# 断言「token 端点应答数 == 1」失败即 CI 红
[[bench]]
name = "token_single_flight_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
