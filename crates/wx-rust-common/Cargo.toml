[package]
name = "wx-rust-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "WxRust 公共基础设施：错误模型、token/执行引擎、HTTP 抽象、会话、重复检查（对应 weixin-java-common）"

[lints]
workspace = true

[features]
default = []
## 启用 Redis 存储（重复检查/分布式锁/配置存储）
redis = ["dep:redis"]

[dependencies]
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
url.workspace = true
base64.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
aes.workspace = true
cbc.workspace = true
rsa.workspace = true
percent-encoding.workspace = true
rand.workspace = true
dashmap.workspace = true
once_cell.workspace = true
tempfile.workspace = true
mime.workspace = true
bytes.workspace = true
futures-util.workspace = true
redis = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# RSA mitigation 测试：rsa 0.9 依赖 rand_core 0.6（与 workspace rand 0.10 不兼容）
rand_core = { version = "0.10", features = ["getrandom"] }

[[bench]]
name = "crypto_bench"
harness = false

# 并发验收基准（G7）：--test 模式进 CI（cargo bench -- --test），
# 断言失败即 CI 红；token 单飞基准见 wx-rust-miniapp（真实刷新路径所在）
[[bench]]
name = "pipeline_concurrency_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
